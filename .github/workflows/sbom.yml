name: sbom

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
      - name: Generate SBOMs and scan
        run: ./scripts/sbom.sh
      - name: Upload SBOM and VEX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spikes402-sbom
          path: |
            sbom/spikes402-source.cdx.json
            sbom/spikes402-image.cdx.json
            vex/spikes402.openvex.json
          if-no-files-found: error

  # Attach the artifact when a GitHub Release is published from the UI or
  # with a personal token, and only for version tags (v*). Extension-only
  # tags (extension-v*) must not run this job. A tag-triggered run of
  # .github/workflows/release.yml creates the release with GITHUB_TOKEN,
  # which does not fire this event, so that workflow attaches the SBOM itself.
  attach-release:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spikes402-sbom
          path: dist
      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/spikes402-source.cdx.json \
            dist/spikes402-image.cdx.json \
            dist/spikes402.openvex.json \
            --clobber
